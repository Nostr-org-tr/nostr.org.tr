<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="nostrGradient" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="trBadgeGradient" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Background decorative glows -->
  <circle cx="1100" cy="100" r="200" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="150" cy="550" r="250" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="300" fill="#ec4899" opacity="0.05" filter="url(#glow)"/>
  
  <!-- Outer subtle border -->
  <rect x="1.5" y="1.5" width="1197" height="627" rx="0" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Left Column / Brand & Text -->
  <g transform="translate(80, 80)">
    <!-- Top badge -->
    <rect x="0" y="0" width="350" height="40" rx="20" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="5" fill="#e11d48"/>
    <text x="38" y="25" font-family="DejaVu Sans, Inter, sans-serif" font-size="14" font-weight="bold" fill="#c7d2fe">TÜRKİYE NOSTR TOPLULUĞU</text>
    
    <!-- Main Title -->
    <text x="0" y="110" font-family="DejaVu Sans, Inter, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="-1">
      İletişim senin, kimlik senin,
    </text>
    <text x="0" y="175" font-family="DejaVu Sans, Inter, sans-serif" font-size="52" font-weight="bold" fill="url(#accent)" letter-spacing="-1">
      ağ senin.
    </text>
    
    <!-- Subtitle / Description -->
    <text x="0" y="235" font-family="DejaVu Sans, Inter, sans-serif" font-size="20" fill="#94a3b8">
      Merkeziyetsiz, sansürsüz ve açık iletişim protokolü
    </text>
    <text x="0" y="268" font-family="DejaVu Sans, Inter, sans-serif" font-size="20" fill="#94a3b8">
      Nostr'ın Türkiye resmi topluluk ve bilgi merkezi.
    </text>
    
    <!-- Feature tags -->
    <g transform="translate(0, 325)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="80" y="23" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">⚡ Lightning &amp; Zaps</text>
      
      <!-- Tag 2 -->
      <rect x="175" y="0" width="170" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="260" y="23" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🔑 Açık Anahtarlar</text>
      
      <!-- Tag 3 -->
      <rect x="360" y="0" width="180" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="450" y="23" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🌐 Bağımsız Röleler</text>
    </g>
    
    <!-- Domain footer -->
    <g transform="translate(0, 420)">
      <text x="0" y="20" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="bold" fill="#f8fafc">nostr</text>
      <rect x="75" y="2" width="86" height="24" rx="6" fill="#e11d48" fill-opacity="0.2" stroke="#e11d48" stroke-width="1"/>
      <text x="85" y="19" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="bold" fill="#f43f5e">.org.tr</text>
      <text x="180" y="20" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#64748b">• relay.nostr.org.tr</text>
    </g>
  </g>
  
  <!-- Right Column / Big Glowing Nostr Turkey Logo -->
  <g transform="translate(850, 165) scale(2.2)">
    <!-- Nostr Container -->
    <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#nostrGradient)" />
    
    <!-- Ostrich Path -->
    <path d="M42 84 C 42 60, 52 42, 68 32 C 76 26, 84 26, 88 32 C 90 35, 87 40, 81 40 C 72 40, 60 48, 56 68 L 56 84" 
          stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <circle cx="80" cy="33" r="2.5" fill="#FFFFFF" />
    <circle cx="36" cy="76" r="4.5" fill="#DDD6FE" />
    <circle cx="56" cy="84" r="5" fill="#FFFFFF" />
    <circle cx="78" cy="80" r="4.5" fill="#DDD6FE" />
    <path d="M36 76 L 56 84 L 78 80" stroke="#DDD6FE" stroke-width="2.5" stroke-dasharray="3 3" />
    <path d="M40 38 L 46 48 L 42 50 L 48 60 L 41 52 L 44 50 Z" fill="#F59E0B" />
    
    <!-- Turkish Badge -->
    <g transform="translate(74, 10)">
      <circle cx="18" cy="18" r="16" fill="url(#trBadgeGradient)" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M21.5 12 C 17.5 12 14.5 14.5 14.5 18 C 14.5 21.5 17.5 24 21.5 24 C 20.2 23 19.5 20.8 19.5 18 C 19.5 15.2 20.2 13 21.5 12 Z" fill="#FFFFFF" />
      <path d="M23.5 18 L 22.2 18.5 L 22.6 17.2 L 21.6 16.3 L 22.9 16.3 L 23.5 15 L 24.1 16.3 L 25.4 16.3 L 24.4 17.2 L 24.8 18.5 Z" fill="#FFFFFF" />
    </g>
  </g>
</svg>